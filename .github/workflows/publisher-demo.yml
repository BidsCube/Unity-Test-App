name: Publisher demo validation

on:
  push:
  pull_request:

jobs:
  hygiene-and-manifests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Manifests use file:../../… (resolved from Packages/). CI only checks out this repo, so we
      # recreate the monorepo sibling layout next to GITHUB_WORKSPACE (same as a local workspace).
      - name: Provision sibling UPM packages (monorepo layout)
        working-directory: ${{ github.workspace }}/..
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.2.8 https://github.com/BidsCube/bidscube-sdk-unity.git bidscube-sdk-unity
          git clone --depth 1 --branch v1.0.19 https://github.com/BidsCube/AppLovin-SDK-for-BidsCube-Unity.git AppLovin-SDK-Unity
          git clone --depth 1 --branch v1.0.3 https://github.com/BidsCube/LevelPlay-SDK-for-BidsCube-Unity.git LevelPlay-SDK-for-BidsCube-Unity
          git clone --depth 1 --branch v1.2.182 https://github.com/googlesamples/unity-jar-resolver.git unity-jar-resolver

      - name: Validate demo manifest profiles
        run: bash tools/verify-demo-profiles.sh

      - name: Repository hygiene + manifest pins
        run: bash tools/verify-publisher-demo-ready.sh

      - name: Fail on tracked binary artifacts
        run: |
          set -euo pipefail

          if git ls-files | grep -E '\.(apk|aab|ipa|obb)$' | grep -q .; then
            echo "Tracked mobile build artifacts:"
            git ls-files | grep -E '\.(apk|aab|ipa|obb)$' || true
            exit 1
          fi

          echo "OK: no tracked apk/aab/ipa/obb."
